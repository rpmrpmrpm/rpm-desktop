name: DCO

# Checks that every commit in a pull request has a Signed-off-by line (see CONTRIBUTING.md).

on:
  pull_request:

permissions:
  contents: read

jobs:
  signoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check sign-off
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            if ! git log -1 --format=%B "$c" | grep -qi '^Signed-off-by: '; then
              echo "::error::Commit $(git log -1 --format='%h %s' "$c") is not signed off."
              missing=1
            fi
          done
          if [ "$missing" = 1 ]; then
            echo "Sign your commits with 'git commit -s'. To fix this branch:"
            echo "  git rebase --signoff $BASE && git push --force-with-lease"
            exit 1
          fi
