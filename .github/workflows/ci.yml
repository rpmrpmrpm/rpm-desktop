name: CI

# Runs only when the code changes, so a change to the docs does not start a build.
on:
  pull_request:
    paths: ['RPM.*/**', 'tools/**', '*.props', '*.targets', 'global.json', '.github/workflows/ci.yml']
  push:
    branches: [main]
    paths: ['RPM.*/**', 'tools/**', '*.props', '*.targets', 'global.json', '.github/workflows/ci.yml']

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: rpm-desktop
      # Some tests read the shared files (strings.json and others) from the rpm repo next to this one.
      - uses: actions/checkout@v7
        with:
          repository: rpmrpmrpm/rpm
          path: rpm
          # A private repo can only be checked out with the organisation secret SIBLING_REPOS_TOKEN,
          # a token that can read the rpm repos. A public repo needs no secret.
          token: ${{ secrets.SIBLING_REPOS_TOKEN || github.token }}
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      # The vinyl restorer tests run ffmpeg from the PATH. The DataGrid text tests need an installed
      # font that draws Japanese.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-cjk
      - run: dotnet test RPM.Core.Tests
        working-directory: rpm-desktop
      - run: dotnet test RPM.Fingerprint.Tests
        working-directory: rpm-desktop
      - run: dotnet test RPM.DataGrid.Tests
        working-directory: rpm-desktop

  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: rpm-desktop
      # The icon fonts, copied from ../rpm-fonts-pro by the build. Without them (a pull request from a
      # fork gets no secrets) the build warns and the icons are blank.
      - uses: actions/checkout@v7
        continue-on-error: true
        with:
          repository: rpmrpmrpm/rpm-fonts-pro
          path: rpm-fonts-pro
          token: ${{ secrets.SIBLING_REPOS_TOKEN }}
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - run: dotnet build RPM.Desktop/RPM.Desktop.csproj -f net10.0-desktop
        working-directory: rpm-desktop
        # The build downloads ffmpeg from this repo's releases. While the repo is private, fetch-tools
        # uses the GitHub CLI with this token for that.
        env:
          GH_TOKEN: ${{ secrets.SIBLING_REPOS_TOKEN }}
