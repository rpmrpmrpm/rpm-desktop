name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ['**.md', '.github/ISSUE_TEMPLATE/**']

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet test RPM.Core.Tests
      - run: dotnet test RPM.Fingerprint.Tests
      - run: dotnet test RPM.DataGrid.Tests

  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet build RPM.Desktop/RPM.Desktop.csproj -f net10.0-desktop
